[project]
name = "multi-agent-ai-system"
version = "1.0.0"
description = "Multi-Agent AI Research & Analysis Assistant"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "openai-agents>=0.24.0",
    "chromadb>=0.5.0",
    "duckduckgo-search>=8.0.0",
    "pypdf>=5.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "reportlab>=4.0.0",
]

[tool.vercel]
entrypoint = "src/api/main.py"
